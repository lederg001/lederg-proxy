name: Worker tests

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Worker unit tests
        run: node --test worker/worker.test.mjs
